; Required for legacy short PHP open tags (<? ... ?>) used throughout this codebase
short_open_tag = On

; Suppress inline error output so PHP warnings don't corrupt HTTP/gzip responses
display_errors = On
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; eaccelerator and ZendOptimizer are PHP 5.2-era extensions not available on modern PHP
;zend_extension="/usr/local/lib/php/extensions/no-debug-non-zts-20060613/eaccelerator.so"
;eaccelerator.shm_size="16"
;eaccelerator.cache_dir="/home/aatrader/tmp/eaccelerator"
;eaccelerator.enable="1"
;eaccelerator.optimizer="1"
;eaccelerator.check_mtime="1"
;eaccelerator.debug="0"
;eaccelerator.filter=""
;eaccelerator.shm_max="0"
;eaccelerator.shm_ttl="0"
;eaccelerator.shm_prune_period="0"
;eaccelerator.shm_only="0"
;eaccelerator.compress="1"
;eaccelerator.compress_level="9"
;zend_extension="/usr/local/Zend/lib/Optimizer-3.3.9/php-5.2.x/ZendOptimizer.so"